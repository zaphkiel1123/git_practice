<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Footprint Candlestick Viewer</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1e1e1e; color: #d4d4d4; }
    #controls { padding: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #controls label, #controls button { cursor: pointer; padding: 6px 14px; background: #2d5a9e; border-radius: 4px; font-size: 14px; border: none; color: #d4d4d4; }
    #controls label:hover, #controls button:hover { background: #3a6db5; }
    #controls button.active { background: #1b8a5a; }
    .file-input { display: none; }
    #info { font-size: 13px; color: #888; }
    #charts-wrapper { display: flex; width: 100%; height: calc(100vh - 48px); }
    #chart-left { width: 50%; min-width: 0; height: 100%; overflow: hidden; }
    #chart-right { flex: 1; min-width: 0; height: 100%; overflow: hidden; }
    #divider { width: 5px; flex-shrink: 0; cursor: col-resize; background: #333; transition: background 0.15s; }
    #divider:hover, #divider.dragging { background: #5a5a5a; }
    body.resizing { user-select: none; cursor: col-resize; }
    body.resizing #chart-left, body.resizing #chart-right { pointer-events: none; }
</style>
</head>
<body>
<div id="controls">
    <label for="tick-input">Load tick .data (57-byte)</label>
    <input type="file" id="tick-input" class="file-input" accept=".data,.bin" />
    <label for="minute-input">Load minute .data (60-byte)</label>
    <input type="file" id="minute-input" class="file-input" accept=".data,.bin" />
    <label for="trades-input">Load trades .json</label>
    <input type="file" id="trades-input" class="file-input" accept=".json" />
    <button id="sync-btn">Sync: OFF</button>
    <span id="info">Load a tick-level or minute-bar binary .data file</span>
</div>
<div id="charts-wrapper">
    <div id="chart-left"></div>
    <div id="divider"></div>
    <div id="chart-right"></div>
</div>

<script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function() {
    'use strict';

    const TICK_RECORD_SIZE = 57;
    const MINUTE_RECORD_SIZE = 60;
    const DOTNET_EPOCH_UNIX_SEC = -62135596800;
    const TICK_SIZE = 0.25;

    const leftContainer = document.getElementById('chart-left');
    const rightContainer = document.getElementById('chart-right');
    const info = document.getElementById('info');

    const chartOpts = {
        layout: { background: { color: '#1e1e1e' }, textColor: '#d4d4d4' },
        grid: { vertLines: { visible: false }, horzLines: { visible: false } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#3a3a3a' },
        rightPriceScale: { borderColor: '#3a3a3a' },
        handleScroll: { mouseWheel: true, pressedMouseMove: true },
        handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: true },
    };

    // --- Left chart: footprint ---
    const chartL = LightweightCharts.createChart(leftContainer, chartOpts);
    const candleSeriesL = chartL.addSeries(LightweightCharts.CandlestickSeries, {
        upColor: 'transparent', downColor: 'transparent',
        borderUpColor: 'transparent', borderDownColor: 'transparent',
        wickUpColor: 'transparent', wickDownColor: 'transparent',
    });
    const volumeSeriesL = chartL.addSeries(LightweightCharts.HistogramSeries, {
        priceFormat: { type: 'volume' }, priceScaleId: 'volume',
    }, 1);
    chartL.priceScale('volume').applyOptions({ scaleMargins: { top: 0, bottom: 0 } });

    // --- Right chart: plain candle + CVD candle ---
    const chartR = LightweightCharts.createChart(rightContainer, chartOpts);
    const candleSeriesR = chartR.addSeries(LightweightCharts.CandlestickSeries, {
        upColor: '#3efe35', downColor: '#ff1100',
        borderUpColor: '#3efe35', borderDownColor: '#ff1100',
        wickUpColor: '#3efe35', wickDownColor: '#ff1100',
    });
    const cvdSeries = chartR.addSeries(LightweightCharts.CandlestickSeries, {
        upColor: '#26a69a', downColor: '#9c27b0',
        borderUpColor: '#26a69a', borderDownColor: '#9c27b0',
        wickUpColor: '#26a69a', wickDownColor: '#9c27b0',
    }, 1);

    // --- Sync toggle ---
    let synced = false;
    let syncing = false;
    const syncBtn = document.getElementById('sync-btn');

    syncBtn.addEventListener('click', function() {
        synced = !synced;
        syncBtn.textContent = synced ? 'Sync: ON' : 'Sync: OFF';
        syncBtn.classList.toggle('active', synced);
        if (synced) syncCharts();
    });

    function syncCharts() {
        if (!synced) return;
        const range = chartL.timeScale().getVisibleLogicalRange();
        if (range) chartR.timeScale().setVisibleLogicalRange(range);
    }

    chartL.timeScale().subscribeVisibleLogicalRangeChange(function(range) {
        if (syncing || !synced || !range) return;
        syncing = true;
        chartR.timeScale().setVisibleLogicalRange(range);
        syncing = false;
    });
    chartR.timeScale().subscribeVisibleLogicalRangeChange(function(range) {
        if (syncing || !synced || !range) return;
        syncing = true;
        chartL.timeScale().setVisibleLogicalRange(range);
        syncing = false;
    });

    // --- Crosshair sync (always active, independent of scroll sync) ---
    let crosshairSyncing = false;
    chartL.subscribeCrosshairMove(function(param) {
        if (crosshairSyncing) return;
        crosshairSyncing = true;
        if (param.time) {
            chartR.setCrosshairPosition(undefined, param.time, candleSeriesR);
        } else {
            chartR.clearCrosshairPosition();
        }
        crosshairSyncing = false;
    });
    chartR.subscribeCrosshairMove(function(param) {
        if (crosshairSyncing) return;
        crosshairSyncing = true;
        if (param.time) {
            chartL.setCrosshairPosition(undefined, param.time, candleSeriesL);
        } else {
            chartL.clearCrosshairPosition();
        }
        crosshairSyncing = false;
    });

    // --- Footprint data store ---
    let footprintData = new Map();

    // --- Footprint primitive plugin ---
    class FootprintPrimitive {
        constructor(series, chart) { this._series = series; this._chart = chart; }
        updateAllViews() {}
        paneViews() { return [new FootprintPaneView(this._series, this._chart)]; }
    }

    class FootprintPaneView {
        constructor(series, chart) { this._series = series; this._chart = chart; }
        update() {}
        renderer() { return new FootprintRenderer(this._series, this._chart); }
        zOrder() { return 'top'; }
    }

    class FootprintRenderer {
        constructor(series, chart) { this._series = series; this._chart = chart; }

        draw(target) {
            target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
                const timeScale = this._chart.timeScale();
                const visibleRange = timeScale.getVisibleLogicalRange();
                if (!visibleRange) return;

                const data = this._series.data();
                if (!data || data.length === 0) return;

                const startIdx = Math.max(0, Math.floor(visibleRange.from));
                const endIdx = Math.min(data.length - 1, Math.ceil(visibleRange.to));

                const barsVisible = visibleRange.to - visibleRange.from;
                const barWidth = mediaSize.width / barsVisible;

                const candleLeft = -0.45 * barWidth;
                const candleRight = -0.35 * barWidth;
                const candleMid = (candleLeft + candleRight) / 2;
                const candleW = candleRight - candleLeft;

                const fpLeftOff = -0.30 * barWidth;
                const fpRightOff = 0.45 * barWidth;
                const fpWidth = fpRightOff - fpLeftOff;
                const fpCenterOff = (fpLeftOff + fpRightOff) / 2;
                const fpHalfW = fpWidth / 2;

                const fontSize = Math.max(7, Math.min(11, barWidth * 0.11)) + 2;
                ctx.textBaseline = 'middle';

                for (let i = startIdx; i <= endIdx; i++) {
                    const bar = data[i];
                    if (!bar) continue;

                    const x = timeScale.timeToCoordinate(bar.time);
                    if (x === null) continue;

                    const isUp = bar.close >= bar.open;

                    const openY = this._series.priceToCoordinate(bar.open);
                    const closeY = this._series.priceToCoordinate(bar.close);
                    const highY = this._series.priceToCoordinate(bar.high);
                    const lowY = this._series.priceToCoordinate(bar.low);
                    if (openY === null || closeY === null || highY === null || lowY === null) continue;

                    const bodyTop = Math.min(openY, closeY);
                    const bodyBot = Math.max(openY, closeY);
                    const bodyH = Math.max(bodyBot - bodyTop, 1);
                    const color = isUp ? '#3efe35' : '#ff1100';

                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x + candleMid, highY);
                    ctx.lineTo(x + candleMid, lowY);
                    ctx.stroke();

                    ctx.fillStyle = color;
                    ctx.fillRect(x + candleLeft, bodyTop, candleW, bodyH);

                    const levels = footprintData.get(bar.time);
                    if (!levels || levels.size === 0) continue;

                    let maxVol = 0;
                    for (const [, counts] of levels) {
                        maxVol = Math.max(maxVol, counts.buy, counts.sell);
                    }
                    if (maxVol === 0) maxVol = 1;

                    ctx.font = `${fontSize}px monospace`;

                    for (const [price, counts] of levels) {
                        const y = this._series.priceToCoordinate(price);
                        if (y === null) continue;

                        const nextY = this._series.priceToCoordinate(price - TICK_SIZE);
                        const cellH = nextY !== null ? Math.abs(nextY - y) : fontSize + 2;
                        const h = Math.max(cellH * 0.85, fontSize + 1);

                        const fpCX = x + fpCenterOff;

                        const buyBarW = (counts.buy / maxVol) * fpHalfW;
                        const sellBarW = (counts.sell / maxVol) * fpHalfW;

                        ctx.fillStyle = 'rgba(38,166,154,0.25)';
                        ctx.fillRect(fpCX, y - h / 2, buyBarW, h);

                        ctx.fillStyle = 'rgba(239,83,80,0.25)';
                        ctx.fillRect(fpCX - sellBarW, y - h / 2, sellBarW, h);

                        if (barWidth > 50 && fontSize >= 9) {
                            const sellX = fpCX - fpHalfW * 0.5;
                            const buyX = fpCX + fpHalfW * 0.5;

                            // 3x highlight: buy at x vs sell at x-0.25; sell at x vs buy at x+0.25
                            const belowLevel = levels.get(price - TICK_SIZE);
                            const aboveLevel = levels.get(price + TICK_SIZE);
                            const belowSell = belowLevel ? belowLevel.sell : 0;
                            const aboveBuy = aboveLevel ? aboveLevel.buy : 0;
                            const buyBold = belowSell > 0 && counts.buy >= 3 * belowSell;
                            const sellBold = aboveBuy > 0 && counts.sell >= 3 * aboveBuy;

                            ctx.textAlign = 'center';
                            ctx.font = sellBold ? `bold ${fontSize + 1}px monospace` : `${fontSize}px monospace`;
                            ctx.fillStyle = sellBold ? '#ff1100' : '#fff';
                            ctx.fillText(counts.sell.toString(), sellX, y);

                            ctx.font = buyBold ? `bold ${fontSize + 1}px monospace` : `${fontSize}px monospace`;
                            ctx.fillStyle = buyBold ? '#3efe35' : '#fff';
                            ctx.fillText(counts.buy.toString(), buyX, y);
                        } else if (barWidth > 25 && fontSize >= 9) {
                            const net = counts.buy - counts.sell;
                            ctx.textAlign = 'center';
                            ctx.font = `${fontSize}px monospace`;
                            ctx.fillStyle = '#fff';
                            ctx.fillText(net > 0 ? `+${net}` : net.toString(), fpCX, y);
                        }
                    }
                }
            });
        }
    }

    const footprintPrimitive = new FootprintPrimitive(candleSeriesL, chartL);
    candleSeriesL.attachPrimitive(footprintPrimitive);

    // --- Timestamp decoding ---
    function ticksToUnixSeconds(ticksHi, ticksLo) {
        const ticks = BigInt(ticksHi) * BigInt(0x100000000) + BigInt(ticksLo >>> 0);
        const seconds = Number(ticks / 10000000n);
        return seconds + DOTNET_EPOCH_UNIX_SEC;
    }

    function floorToMinute(unixSec) {
        return unixSec - (unixSec % 60);
    }

    // --- Decode 57-byte tick records into minute bars with footprint + CVD ---
    function decodeTickData(buffer) {
        const view = new DataView(buffer);
        const numRecords = Math.floor(buffer.byteLength / TICK_RECORD_SIZE);
        const barMap = new Map(); // time -> {open, high, low, close, volume, levels, deltas}

        for (let i = 0; i < numRecords; i++) {
            const offset = i * TICK_RECORD_SIZE;

            const ticksLo = view.getUint32(offset, true);
            const ticksHi = view.getUint32(offset + 4, true);
            const rawTime = ticksToUnixSeconds(ticksHi, ticksLo);
            const time = floorToMinute(rawTime);

            const price = view.getFloat64(offset + 8, true);
            const levelLow = view.getFloat64(offset + 16, true);
            const levelHigh = view.getFloat64(offset + 24, true);
            const txnCount = view.getUint32(offset + 32, true);

            const isBuy = Math.abs(price - levelHigh) < 1e-9;
            const delta = isBuy ? txnCount : -txnCount;

            let bar = barMap.get(time);
            if (!bar) {
                bar = { open: price, high: price, low: price, close: price, volume: 0, levels: new Map(), deltas: [] };
                barMap.set(time, bar);
            } else {
                bar.high = Math.max(bar.high, price);
                bar.low = Math.min(bar.low, price);
                bar.close = price;
            }
            bar.volume += txnCount;
            bar.deltas.push(delta);

            let lvl = bar.levels.get(price);
            if (!lvl) { lvl = { buy: 0, sell: 0 }; bar.levels.set(price, lvl); }
            if (isBuy) lvl.buy += txnCount;
            else lvl.sell += txnCount;
        }

        // Sort by time and build arrays
        const times = [...barMap.keys()].sort((a, b) => a - b);
        const candles = [];
        const volumes = [];
        const cvdCandles = [];
        footprintData = new Map();

        let cumDelta = 0;

        for (const time of times) {
            const bar = barMap.get(time);
            candles.push({ time, open: bar.open, high: bar.high, low: bar.low, close: bar.close });
            volumes.push({
                time, value: bar.volume,
                color: bar.close >= bar.open ? 'rgba(38,166,154,0.4)' : 'rgba(239,83,80,0.4)',
            });
            footprintData.set(time, bar.levels);

            // CVD candle: track running cumulative delta through each tick in the bar
            const cvdOpen = cumDelta;
            let cvdHigh = cumDelta;
            let cvdLow = cumDelta;
            for (const d of bar.deltas) {
                cumDelta += d;
                if (cumDelta > cvdHigh) cvdHigh = cumDelta;
                if (cumDelta < cvdLow) cvdLow = cumDelta;
            }
            const cvdClose = cumDelta;
            cvdCandles.push({ time, open: cvdOpen, high: cvdHigh, low: cvdLow, close: cvdClose });
        }

        return { candles, volumes, cvdCandles, numRecords };
    }

    // --- Decode 60-byte minute-bar records ---
    function decodeMinuteData(buffer) {
        const view = new DataView(buffer);
        const numRecords = Math.floor(buffer.byteLength / MINUTE_RECORD_SIZE);
        const candles = [];
        const volumes = [];
        const cvdCandles = [];
        footprintData = new Map();

        let cumDelta = 0;

        for (let i = 0; i < numRecords; i++) {
            const offset = i * MINUTE_RECORD_SIZE;

            const ticksLo = view.getUint32(offset, true);
            const ticksHi = view.getUint32(offset + 4, true);
            const time = ticksToUnixSeconds(ticksHi, ticksLo);

            const high  = view.getFloat64(offset + 8, true);
            const low   = view.getFloat64(offset + 16, true);
            const open  = view.getFloat64(offset + 24, true);
            const close = view.getFloat64(offset + 32, true);

            const sellCount = view.getUint32(offset + 40, true);
            const buyCount  = view.getUint32(offset + 44, true);
            const volume    = view.getUint32(offset + 48, true);

            candles.push({ time, open, high, low, close });
            volumes.push({
                time, value: volume,
                color: close >= open ? 'rgba(38,166,154,0.4)' : 'rgba(239,83,80,0.4)',
            });

            const levels = new Map();
            levels.set(close, { buy: buyCount, sell: sellCount });
            footprintData.set(time, levels);

            // CVD candle (approximate: no intra-bar detail)
            const cvdOpen = cumDelta;
            const barDelta = buyCount - sellCount;
            cumDelta += barDelta;
            const cvdClose = cumDelta;
            cvdCandles.push({
                time,
                open: cvdOpen,
                high: Math.max(cvdOpen, cvdClose),
                low: Math.min(cvdOpen, cvdClose),
                close: cvdClose,
            });
        }

        return { candles, volumes, cvdCandles, numRecords };
    }

    function loadData(candles, volumes, cvdCandles, numRecords, fileName) {
        if (candles.length === 0) {
            info.textContent = 'No records found in file.';
            return;
        }

        // Left chart
        candleSeriesL.setData(candles);
        volumeSeriesL.setData(volumes);
        chartL.timeScale().fitContent();

        // Right chart
        candleSeriesR.setData(candles);
        cvdSeries.setData(cvdCandles);
        chartR.timeScale().fitContent();

        const first = new Date(candles[0].time * 1000).toISOString().slice(0, 16);
        const last = new Date(candles[candles.length - 1].time * 1000).toISOString().slice(0, 16);
        info.textContent = `${fileName} — ${numRecords} records → ${candles.length} bars | ${first} → ${last} | Scroll to zoom, drag to pan`;
    }

    document.getElementById('tick-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const { candles, volumes, cvdCandles, numRecords } = decodeTickData(evt.target.result);
            loadData(candles, volumes, cvdCandles, numRecords, file.name);
        };
        reader.readAsArrayBuffer(file);
    });

    document.getElementById('minute-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const { candles, volumes, cvdCandles, numRecords } = decodeMinuteData(evt.target.result);
            loadData(candles, volumes, cvdCandles, numRecords, file.name);
        };
        reader.readAsArrayBuffer(file);
    });

    // --- Volume label primitive for left chart volume pane ---
    class VolumeLabelPrimitive {
        constructor(series, chart) { this._series = series; this._chart = chart; }
        updateAllViews() {}
        paneViews() { return [new VolumeLabelPaneView(this._series, this._chart)]; }
    }
    class VolumeLabelPaneView {
        constructor(series, chart) { this._series = series; this._chart = chart; }
        update() {}
        renderer() { return new VolumeLabelRenderer(this._series, this._chart); }
        zOrder() { return 'top'; }
    }
    class VolumeLabelRenderer {
        constructor(series, chart) { this._series = series; this._chart = chart; }
        draw(target) {
            target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
                const timeScale = this._chart.timeScale();
                const visibleRange = timeScale.getVisibleLogicalRange();
                if (!visibleRange) return;
                const data = this._series.data();
                if (!data || data.length === 0) return;
                const startIdx = Math.max(0, Math.floor(visibleRange.from));
                const endIdx = Math.min(data.length - 1, Math.ceil(visibleRange.to));
                const barsVisible = visibleRange.to - visibleRange.from;
                const barWidth = mediaSize.width / barsVisible;
                const fontSize = Math.max(9, Math.min(13, barWidth * 0.22));
                if (fontSize < 9) return;
                ctx.font = `bold ${fontSize}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ddd';
                const bottomY = this._series.priceToCoordinate(0);
                for (let i = startIdx; i <= endIdx; i++) {
                    const point = data[i];
                    if (!point) continue;
                    const x = timeScale.timeToCoordinate(point.time);
                    if (x === null) continue;
                    const topY = this._series.priceToCoordinate(point.value);
                    if (topY === null || bottomY === null) continue;
                    const midY = (topY + bottomY) / 2;
                    const label = point.value >= 1000
                        ? (point.value / 1000).toFixed(1) + 'K'
                        : point.value.toString();
                    ctx.fillText(label, x, midY);
                }
            });
        }
    }
    volumeSeriesL.attachPrimitive(new VolumeLabelPrimitive(volumeSeriesL, chartL));

    // --- Trade markers overlay (loaded from trades.json) ---
    let tradeData = [];

    class TradeMarkerPrimitive {
        constructor(series, chart) { this._series = series; this._chart = chart; }
        updateAllViews() {}
        paneViews() { return [new TradeMarkerPaneView(this._series, this._chart)]; }
    }
    class TradeMarkerPaneView {
        constructor(series, chart) { this._series = series; this._chart = chart; }
        update() {}
        renderer() { return new TradeMarkerRenderer(this._series, this._chart); }
        zOrder() { return 'top'; }
    }
    class TradeMarkerRenderer {
        constructor(series, chart) { this._series = series; this._chart = chart; }
        draw(target) {
            target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
                if (tradeData.length === 0) return;
                const timeScale = this._chart.timeScale();
                const visibleRange = timeScale.getVisibleLogicalRange();
                if (!visibleRange) return;

                for (const trade of tradeData) {
                    const entryX = timeScale.timeToCoordinate(trade.entry_time);
                    const exitX = timeScale.timeToCoordinate(trade.exit_time);
                    if (entryX === null) continue;

                    const entryY = this._series.priceToCoordinate(trade.entry_price);
                    const slY = this._series.priceToCoordinate(trade.sl_price);
                    const tpY = this._series.priceToCoordinate(trade.tp_price);
                    if (entryY === null || slY === null || tpY === null) continue;

                    const isWin = trade.result === 'WIN';
                    const isLong = trade.direction === 'LONG';
                    const rightX = exitX !== null ? exitX : entryX + 80;

                    // Entry marker (triangle)
                    ctx.fillStyle = isLong ? '#3efe35' : '#ff1100';
                    ctx.beginPath();
                    if (isLong) {
                        ctx.moveTo(entryX, entryY + 6);
                        ctx.lineTo(entryX - 5, entryY + 14);
                        ctx.lineTo(entryX + 5, entryY + 14);
                    } else {
                        ctx.moveTo(entryX, entryY - 6);
                        ctx.lineTo(entryX - 5, entryY - 14);
                        ctx.lineTo(entryX + 5, entryY - 14);
                    }
                    ctx.closePath();
                    ctx.fill();

                    // SL line (red dashed)
                    ctx.strokeStyle = 'rgba(255,17,0,0.7)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 3]);
                    ctx.beginPath();
                    ctx.moveTo(entryX, slY);
                    ctx.lineTo(rightX, slY);
                    ctx.stroke();

                    // TP line (green dashed)
                    ctx.strokeStyle = 'rgba(62,254,53,0.7)';
                    ctx.beginPath();
                    ctx.moveTo(entryX, tpY);
                    ctx.lineTo(rightX, tpY);
                    ctx.stroke();

                    // Entry line (white dotted)
                    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                    ctx.setLineDash([2, 2]);
                    ctx.beginPath();
                    ctx.moveTo(entryX, entryY);
                    ctx.lineTo(rightX, entryY);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Result badge at exit
                    if (exitX !== null) {
                        const exitY = this._series.priceToCoordinate(trade.exit_price);
                        if (exitY !== null) {
                            ctx.fillStyle = isWin ? '#3efe35' : '#ff1100';
                            ctx.beginPath();
                            ctx.arc(exitX, exitY, 4, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    // PnL label
                    ctx.font = '10px monospace';
                    ctx.fillStyle = isWin ? '#3efe35' : '#ff1100';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    const pnlText = (trade.pnl_points >= 0 ? '+' : '') + trade.pnl_points.toFixed(2);
                    ctx.fillText(pnlText, entryX + 8, entryY - 2);
                }
            });
        }
    }

    const tradeMarkerL = new TradeMarkerPrimitive(candleSeriesL, chartL);
    candleSeriesL.attachPrimitive(tradeMarkerL);
    const tradeMarkerR = new TradeMarkerPrimitive(candleSeriesR, chartR);
    candleSeriesR.attachPrimitive(tradeMarkerR);

    document.getElementById('trades-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const json = JSON.parse(evt.target.result);
                tradeData = json.trades || [];
                // Floor trade times to minute boundaries to match chart data
                tradeData.forEach(function(t) {
                    t.entry_time = t.entry_time - (t.entry_time % 60);
                    t.exit_time = t.exit_time - (t.exit_time % 60);
                });
                const wins = tradeData.filter(function(t) { return t.result === 'WIN'; }).length;
                const losses = tradeData.filter(function(t) { return t.result === 'LOSS'; }).length;
                info.textContent = `Loaded ${tradeData.length} trades (${wins}W / ${losses}L) from ${file.name}`;
                chartL.timeScale().fitContent();
                chartR.timeScale().fitContent();
            } catch (err) {
                info.textContent = 'Error parsing trades JSON: ' + err.message;
            }
        };
        reader.readAsText(file);
    });

    // --- Resizable divider ---
    const divider = document.getElementById('divider');
    let dragging = false;
    divider.addEventListener('mousedown', function(e) {
        dragging = true;
        divider.classList.add('dragging');
        document.body.classList.add('resizing');
        e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        e.preventDefault();
        const wrapper = document.getElementById('charts-wrapper');
        const rect = wrapper.getBoundingClientRect();
        const dividerW = divider.offsetWidth;
        const available = rect.width - dividerW;
        const leftPx = e.clientX - rect.left - dividerW / 2;
        const pct = (leftPx / available) * 100;
        const clamped = Math.max(20, Math.min(80, pct));
        leftContainer.style.width = clamped + '%';
        chartL.applyOptions({ width: leftContainer.clientWidth, height: leftContainer.clientHeight });
        chartR.applyOptions({ width: rightContainer.clientWidth, height: rightContainer.clientHeight });
    });
    document.addEventListener('mouseup', function() {
        if (dragging) {
            dragging = false;
            divider.classList.remove('dragging');
            document.body.classList.remove('resizing');
        }
    });

    // Responsive resize
    const ro = new ResizeObserver(() => {
        chartL.applyOptions({ width: leftContainer.clientWidth, height: leftContainer.clientHeight });
        chartR.applyOptions({ width: rightContainer.clientWidth, height: rightContainer.clientHeight });
    });
    ro.observe(leftContainer);
    ro.observe(rightContainer);
})();
</script>
</body>
</html>
